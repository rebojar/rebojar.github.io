<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galeria de imagens do Rebojar.">
  <title>Galeria — Rebojar</title>
  <link rel="icon" type="image/png" href="../assets/favicon-rebojar-circular.png">
  <script src="../assets/rebojar-som.min.js" defer></script>
  <style>
    :root{color-scheme:dark;--papel:#f4efdf;--azul:#11273c;--amarelo:#e8d73a;--laranja:#f2992e}*{box-sizing:border-box}html{min-height:100%;background:#0d2e1a url("../assets/fundo-rebojar-colorido.png") center/cover fixed no-repeat}body{min-height:100dvh;margin:0;padding:clamp(14px,3vw,36px);color:var(--papel);font-family:"Segoe UI",system-ui,sans-serif}header{display:flex;align-items:center;gap:14px;max-width:1500px;margin:0 auto clamp(22px,4vw,42px)}header .controles-som-site{position:static!important;z-index:auto!important;flex:0 0 auto;opacity:1!important;transform:none!important}h1{margin:0 auto 0 0;font:italic clamp(2.5rem,7vw,5rem)/.9 Georgia,serif;text-shadow:0 3px 18px #0009}.voltar{display:grid;width:44px;height:44px;place-items:center;border:1px solid var(--amarelo);border-radius:50%;color:var(--papel);background:#11273cdb;font-size:1.35rem;text-decoration:none}.voltar:focus-visible,.imagem:focus-visible,.fechar:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}#galeria{max-width:1500px;margin:auto;columns:1;column-gap:clamp(10px,1.6vw,18px)}.imagem{display:block;width:100%;margin:0 0 clamp(10px,1.6vw,18px);padding:0;overflow:hidden;break-inside:avoid;border:1px solid #f4efdf45;border-radius:7px;color:var(--papel);background:#10283ae6;box-shadow:0 12px 30px #0007;cursor:zoom-in;text-align:left}.imagem img{display:block;width:100%;height:auto}.imagem-info{display:grid;gap:5px;padding:11px 13px 13px}.imagem-info strong{font:italic 1.08rem/1.2 Georgia,serif}.imagem-info span{font-size:.85rem;line-height:1.4;white-space:pre-wrap}#estado{min-height:55vh;display:grid;place-items:center;margin:0;text-align:center;color:#f4efdfbd}#estado[hidden]{display:none}dialog{width:min(95vw,1100px);max-height:94dvh;padding:0;overflow:auto;border:1px solid var(--amarelo);border-radius:16px;color:var(--papel);background:#10283a;box-shadow:0 24px 70px #07121bcc;scrollbar-width:thin;scrollbar-color:var(--laranja) transparent}dialog::backdrop{background:#071824c7;backdrop-filter:blur(9px)}dialog::-webkit-scrollbar{width:2px}dialog::-webkit-scrollbar-track{background:transparent}dialog::-webkit-scrollbar-thumb{background:var(--laranja)}.detalhe{display:grid;gap:14px;padding:clamp(18px,4vw,34px)}.detalhe img{display:block;max-width:100%;max-height:72dvh;margin:auto;object-fit:contain}.detalhe h2{margin:0;font:italic clamp(1.3rem,3vw,2rem)/1.15 Georgia,serif}.detalhe p{margin:0;white-space:pre-wrap;line-height:1.5}.fechar{position:fixed;z-index:2;top:clamp(12px,3vw,28px);right:clamp(12px,3vw,28px);width:42px;height:42px;border:2px solid var(--amarelo);border-radius:50%;color:var(--papel);background:var(--azul);font-size:1.35rem;cursor:pointer}@media(min-width:42rem){#galeria{columns:2}}@media(min-width:70rem){#galeria{columns:3}}@media(min-width:100rem){#galeria{columns:4}}@media(max-width:560px){header{flex-wrap:wrap;padding-top:0}header .controles-som-site{order:-2;width:100%;align-items:flex-end;justify-content:flex-end;margin-bottom:2px}h1{width:100%;order:-1}}
  </style>
  <style>
    .product-brand{display:inline-flex;align-items:center;gap:.65rem;margin-right:auto}
    .brand{display:inline-flex;align-items:center;gap:.7rem;color:var(--papel);font-size:1.05rem;font-weight:800}
    .brand-mark{width:2.15rem;aspect-ratio:1;border-radius:.52rem;background:url("../assets/favicon-rebojar-circular.png") center/cover;box-shadow:0 .12rem 0 #0004}
    .brand-separator{color:#ffffff85;font-size:1.25rem}
    .rebojar-link{color:#ffffffdb;font-size:.92rem;text-decoration:none;transition:color .15s ease}
    .rebojar-link:hover{color:var(--amarelo)}
    .botao{min-height:42px;padding:8px 14px;border:1px solid transparent;border-radius:999px;color:var(--papel);background:#203f58;font-weight:700;cursor:pointer}
    .botao:hover{border-color:transparent;background:#294e69}
    .botao:focus-visible,.rebojar-link:focus-visible,.imagem:focus-visible,.fechar:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}
    #editor{width:min(92vw,560px);color:#17303d;background:var(--papel)}
    #editor form{display:grid;gap:15px;padding:clamp(20px,4vw,30px)}
    #editor h2{margin:0;font:italic 1.7rem/1.1 Georgia,serif}
    #editor label{display:grid;gap:7px;font-size:.8rem;font-weight:700}
    #editor input,#editor textarea{width:100%;padding:10px 11px;border:1px solid #b9ad98;border-radius:8px;color:#17303d;background:#fffdf6;font:inherit}
    #editor input:focus-visible,#editor textarea:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
    #editor textarea{resize:vertical}
    .acoes{display:flex;justify-content:flex-end;gap:9px}.acoes button{padding:10px 15px;border-radius:999px;font-weight:700;cursor:pointer}.cancelar{border:1px solid #9e927e;color:#314956;background:transparent}.principal{border:1px solid var(--azul);color:var(--papel);background:var(--azul)}
    @media(max-width:560px){.product-brand{width:100%}.brand{font-size:1rem}.brand-mark{width:2rem}.botao{margin-left:auto}header .controles-som-site{order:initial!important;width:auto!important;margin:0!important}}
  </style>
</head>
<body>
  <header><div class="product-brand"><span class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Galeria</span></span><span class="brand-separator" aria-hidden="true">|</span><a class="rebojar-link" href="../#galeria" aria-label="Voltar ao Rebojar">Rebojar ↗</a></div><button id="adicionar" class="botao" type="button">+ Fotografia</button></header>
  <main id="galeria" aria-label="Galeria de imagens"></main>
  <p id="estado">Carregando imagens…</p>
  <dialog id="editor" aria-labelledby="tituloEditor"><form id="formulario"><h2 id="tituloEditor">Guardar fotografia</h2><label>Imagem <input id="arquivo" type="file" accept="image/*" required></label><label>Título <input id="titulo" maxlength="80"></label><label>Legenda <textarea id="legenda" maxlength="600" rows="5"></textarea></label><output id="estadoEditor" aria-live="polite"></output><div class="acoes"><button class="cancelar" type="button">Cancelar</button><button class="principal" type="submit">Guardar</button></div></form></dialog>
  <dialog id="visualizador" aria-label="Fotografia ampliada"><button class="fechar" type="button" aria-label="Fechar">×</button><article class="detalhe"><img id="imagemDetalhe" alt=""><h2 id="tituloDetalhe" hidden></h2><p id="legendaDetalhe" hidden></p></article></dialog>
  <script>
    (()=>{
      const chave="rebojar-bau-itens-v1",galeria=document.querySelector("#galeria"),estado=document.querySelector("#estado"),editor=document.querySelector("#editor"),formulario=document.querySelector("#formulario"),visualizador=document.querySelector("#visualizador");let publicados=[];
      addEventListener("DOMContentLoaded",()=>{const controles=document.querySelector(".controles-som-site");if(controles)document.querySelector("header").append(controles)},{once:true});
      const locais=()=>{try{const itens=JSON.parse(localStorage.getItem(chave)||"[]");return Array.isArray(itens)?itens.filter(item=>item?.tipo==="foto"&&item.imagem):[]}catch{return[]}};
      const salvarLocais=itens=>localStorage.setItem(chave,JSON.stringify(itens));
      function detalhe(item){const img=document.querySelector("#imagemDetalhe"),titulo=document.querySelector("#tituloDetalhe"),legenda=document.querySelector("#legendaDetalhe");img.src=item.arquivo||item.imagem;img.alt=item.titulo||item.legenda||"Fotografia da galeria";titulo.textContent=item.titulo||"";titulo.hidden=!item.titulo;legenda.textContent=item.legenda||"";legenda.hidden=!item.legenda;visualizador.showModal()}
      function cartao(item){const artigo=document.createElement("article");artigo.className="imagem";artigo.tabIndex=0;artigo.setAttribute("role","button");const img=document.createElement("img");img.src=item.arquivo||item.imagem;img.alt=item.titulo||item.legenda||"";img.loading="lazy";img.decoding="async";artigo.append(img);if(item.titulo||item.legenda){const info=document.createElement("div");info.className="imagem-info";if(item.titulo){const forte=document.createElement("strong");forte.textContent=item.titulo;info.append(forte)}if(item.legenda){const texto=document.createElement("span");texto.textContent=item.legenda;info.append(texto)}artigo.append(info)}artigo.addEventListener("click",()=>detalhe(item));artigo.addEventListener("keydown",evento=>{if(evento.key==="Enter"||evento.key===" "){evento.preventDefault();detalhe(item)}});return artigo}
      function renderizar(){const itens=[...locais(),...publicados];galeria.replaceChildren(...itens.map(cartao));estado.hidden=itens.length>0;estado.textContent="Nenhuma fotografia publicada ainda."}
      async function prepararImagem(arquivo){const url=URL.createObjectURL(arquivo);try{const imagem=new Image();imagem.src=url;await imagem.decode();const escala=Math.min(1,1200/Math.max(imagem.naturalWidth,imagem.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(imagem.naturalWidth*escala));canvas.height=Math.max(1,Math.round(imagem.naturalHeight*escala));canvas.getContext("2d",{alpha:false}).drawImage(imagem,0,0,canvas.width,canvas.height);return canvas.toDataURL("image/jpeg",.82)}finally{URL.revokeObjectURL(url)}}
      document.querySelector("#adicionar").addEventListener("click",()=>{formulario.reset();document.querySelector("#estadoEditor").textContent="";editor.showModal()});
      document.querySelector(".cancelar").addEventListener("click",()=>editor.close());editor.addEventListener("click",evento=>{if(evento.target===editor)editor.close()});
      formulario.addEventListener("submit",async evento=>{evento.preventDefault();const arquivo=document.querySelector("#arquivo").files[0],saida=document.querySelector("#estadoEditor");if(!arquivo)return;saida.textContent="Guardando…";try{const itens=locais();itens.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,tipo:"foto",titulo:document.querySelector("#titulo").value.trim(),legenda:document.querySelector("#legenda").value.trim(),imagem:await prepararImagem(arquivo),inclinacao:Number((Math.random()*4-2).toFixed(2))});salvarLocais(itens);editor.close();renderizar()}catch{saida.textContent="Não foi possível guardar esta fotografia."}});
      document.querySelector(".fechar").addEventListener("click",()=>visualizador.close());visualizador.addEventListener("click",evento=>{if(evento.target===visualizador)visualizador.close()});
      addEventListener("storage",evento=>{if(evento.key===chave)renderizar()});renderizar();
      fetch("catalogo.json",{cache:"no-store"}).then(resposta=>{if(!resposta.ok)throw Error(resposta.status);return resposta.json()}).then(catalogo=>{publicados=Array.isArray(catalogo.itens)?catalogo.itens:[];renderizar()}).catch(()=>{estado.textContent=galeria.children.length?"":"Não foi possível abrir o catálogo da galeria."});
    })();
  </script>
</body>
</html>
