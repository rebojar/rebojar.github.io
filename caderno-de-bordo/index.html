<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caderno de bordo · Rebojar</title><link rel="stylesheet" href="estilo.css?v=1791558002"></head>
<body>
<header class="barra"><a class="marca" href="#">rebojar <small>atelier pessoal</small></a><span id="status" role="status">Abrindo caderno…</span><button id="backup">Guardar cópia</button><button id="restaurar">Abrir cópia</button><button id="exportar">Exportar leitura</button></header>
<main>
<section class="mesa" aria-label="Seu caderno"><div class="encadernacao"><div class="costura"></div><section id="capa" hidden aria-label="Capa do caderno"><span id="capaLinha" contenteditable="plaintext-only" role="textbox" aria-label="Texto superior da capa"></span><h1 id="nome" contenteditable="plaintext-only" role="textbox" aria-label="Nome do caderno" spellcheck="true"></h1><p id="capaSubtitulo" contenteditable="plaintext-only" role="textbox" aria-label="Subtítulo da capa"></p><button id="margemCapa" class="margem margem-direita" aria-label="Abrir caderno pela margem" title="Clique ou arraste para a esquerda"></button></section><article class="pagina-esquerda" id="folhaEsquerda" aria-label="Página esquerda"></article><article class="folha" aria-label="Página direita"><button class="margem margem-esquerda" id="margemEsquerda" aria-label="Virar para a página anterior ou fechar a capa" title="Clique ou arraste para a direita"></button><button class="margem margem-direita" id="margemDireita" aria-label="Virar para a próxima página" title="Clique ou arraste para a esquerda"></button><div class="cabecalho-folha"><span id="dataVista"></span><span>REBOJAR / REGISTROS</span></div><h2 id="tituloVista" contenteditable="plaintext-only" role="textbox" aria-label="Título da página" data-placeholder="Título deste dia" spellcheck="true"></h2><div id="palavras" contenteditable="plaintext-only" role="textbox" aria-label="Texto da página" aria-multiline="true" data-placeholder="O que ficou deste dia?" spellcheck="true"></div><div id="mural" aria-label="Fotografias"></div><div class="rodape-folha"><span id="nomeVista"></span><span id="numero"></span></div></article></div><nav class="folhear" aria-label="Folhear caderno"><button id="anterior" aria-label="Página anterior">←</button><span id="contador"></span><button id="proxima" aria-label="Próxima página">→</button></nav></section><aside class="editor-texto" aria-label="Editor de texto"><div class="ferramentas"><div class="data-hora"><label>Data<input id="data" type="date"></label><label>Hora<output id="horaAtual"></output></label></div><label class="check"><input type="checkbox" id="publicar"> Incluir esta página na exportação de leitura</label><button id="excluir" class="discreto">Excluir página</button><p class="ajuda" hidden>Arraste a foto ou o clipe pelo papel. No canto da foto, arraste ↻ para girar. Clique na legenda para escrever. Clique na imagem para ampliar.</p><button id="fecharCaderno">Fechar caderno</button></div><button id="foto">+ Fotografia</button><span id="editorHint" hidden aria-live="polite"></span><label>Cor do texto <input id="textColor" type="color" value="#243b44"></label><label>Opacidade <output id="textAlphaValue">100%</output><input id="textAlpha" type="range" min="0" max="100" value="100"></label><div id="coresTexto" class="cores-recentes" aria-label="Últimas seis cores do texto"></div><label>Tamanho <input id="fontSize" type="number" min="6" max="96" value="12" aria-label="Tamanho em pixels"></label><div class="formatos"><button data-format="bold" title="Negrito"><b>B</b></button><button data-format="italic" title="Itálico"><i>I</i></button><button data-format="underline" title="Sublinhado"><u>U</u></button><button data-format="strikeThrough" title="Tachado"><s>S</s></button></div><label>Grifar <input id="markColor" type="color" value="#E8D73A"></label><label>Opacidade do grifo <output id="markAlphaValue">100%</output><input id="markAlpha" type="range" min="0" max="100" value="100"></label><div id="coresGrifo" class="cores-recentes" aria-label="Últimas seis cores do grifo"></div><div class="alinhamentos"><button data-format="justifyLeft">Esquerda</button><button data-format="justifyCenter">Centro</button><button data-format="justifyRight">Direita</button><button data-format="justifyFull">Justificar</button></div><p hidden>Arraste a borda laranja para mover a caixa de texto.</p></aside></main><div id="fotosLivres" aria-label="Fotografias soltas fora do caderno"></div>
<input type="file" id="arquivoFoto" accept="image/jpeg,image/png,image/webp" multiple hidden><input type="file" id="arquivoBackup" accept="application/json,.json" hidden>
<dialog id="ampliacao"><button id="fechar">Fechar ×</button><figure><img alt=""><figcaption></figcaption></figure></dialog>
<script src="editor.js?v=1791558002"></script><script src="paginacao.js?v=1791558002"></script><script src="caderno.js?v=1791558002"></script></body></html>
